      <ellipse cx="426" cy="282" rx="135" ry="72" transform="rotate(-24 426 282)" fill="url(#mouth-hl-grad)" />
      <ellipse cx="628" cy="396" rx="108" ry="62" fill="#6d0040" opacity="0.28" />
