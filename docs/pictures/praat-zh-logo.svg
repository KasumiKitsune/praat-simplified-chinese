<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- 嘴唇渐变 -->
    <linearGradient id="lips-base-grad" x1="48%" y1="10%" x2="52%" y2="95%">
      <stop offset="0%" stop-color="#f982c0" />
      <stop offset="50%" stop-color="#f36cb3" />
      <stop offset="100%" stop-color="#e858a3" />
    </linearGradient>
    <radialGradient id="lips-hl-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc2e2" stop-opacity="0.72" />
      <stop offset="60%" stop-color="#faa2d1" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f471b5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lips-sh-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#db4491" stop-opacity="0.52" />
      <stop offset="65%" stop-color="#e3529c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f36cb3" stop-opacity="0" />
    </radialGradient>

    <!-- 口腔内部渐变 -->
    <radialGradient id="mouth-base-grad" cx="46%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#b41773" />
      <stop offset="55%" stop-color="#9b045e" />
      <stop offset="100%" stop-color="#7c0049" />
    </radialGradient>
    <radialGradient id="mouth-hl-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d2559e" stop-opacity="0.58" />
      <stop offset="60%" stop-color="#b82c7d" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#9b045e" stop-opacity="0" />
    </radialGradient>

    <!-- 耳朵渐变 -->
    <linearGradient id="ear-base-grad" x1="25%" y1="15%" x2="78%" y2="90%">
      <stop offset="0%" stop-color="#fbd4ab" />
      <stop offset="55%" stop-color="#f9cca0" />
      <stop offset="100%" stop-color="#f5c090" />
    </linearGradient>
    <radialGradient id="ear-hl-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9d0" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#fde0bf" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbd2a8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ear-tan-grad" cx="55%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ba8155" stop-opacity="0.88" />
      <stop offset="58%" stop-color="#d8a276" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f8ca9e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ear-brown-grad" cx="52%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#332217" stop-opacity="0.96" />
      <stop offset="62%" stop-color="#5d422e" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#9a6b48" stop-opacity="0" />
    </radialGradient>

    <!-- 裁剪路径 -->
    <clipPath id="lips-clip">
      <path d="M 476,108 C 450,104 430,62 396,56 C 362,50 338,88 316,138 C 282,210 212,272 146,300 C 114,314 78,308 58,332 C 42,352 44,390 66,416 C 98,452 162,482 224,514 C 286,544 386,548 492,542 C 584,538 660,522 742,488 C 820,456 888,428 926,392 C 954,366 954,330 932,308 C 906,284 848,280 798,250 C 748,220 684,142 630,86 C 602,56 580,48 552,58 C 526,68 500,112 476,108 Z" />
    </clipPath>

    <clipPath id="mouth-clip">
      <path d="M 416,218 C 452,222 486,220 516,218 C 558,226 620,266 680,294 C 714,310 734,340 730,376 C 726,400 698,422 652,446 C 610,458 538,458 462,456 C 394,454 344,448 312,418 C 282,392 268,372 276,344 C 286,314 344,272 416,218 Z" />
    </clipPath>

    <clipPath id="ear-clip">
      <path d="M 332,604 C 386,598 464,598 536,596 C 574,595 606,612 624,630 C 632,648 614,666 588,686 C 558,708 530,732 526,752 C 526,772 548,796 582,832 C 608,858 628,882 632,906 C 634,926 614,946 582,954 C 548,960 506,960 474,946 C 444,924 416,888 378,844 C 344,806 314,782 296,746 C 284,718 282,668 294,634 C 302,616 316,606 332,604 Z" />
