      <ellipse cx="235" cy="295" rx="115" ry="65" transform="rotate(-22 235 295)" fill="url(#lips-hl-grad)" />
      <ellipse cx="755" cy="272" rx="125" ry="65" transform="rotate(24 755 272)" fill="url(#lips-hl-grad)" />
      <ellipse cx="892" cy="346" rx="75" ry="48" fill="url(#lips-hl-grad)" />
