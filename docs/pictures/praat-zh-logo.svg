      <path d="M 552,786 C 576,804 612,834 634,864 C 646,880 648,894 644,904 C 640,916 644,932 634,940 C 622,948 612,952 604,952 C 604,948 616,942 622,930 C 628,918 626,902 620,886 C 606,858 576,826 546,798 C 546,792 548,786 552,786 Z" />
